<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kubcrafter: деньги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-theme="light"]{
 --bg:radial-gradient(900px 640px at 100% 0%,rgba(150,120,255,.38),transparent 70%),radial-gradient(800px 700px at 0% 65%,rgba(90,170,255,.30),transparent 70%),radial-gradient(700px 600px at 100% 100%,rgba(255,150,210,.26),transparent 70%),#E8EDFB;
 --card:rgba(255,255,255,.58);--cardb:1px solid rgba(255,255,255,.9);--shadow:0 8px 24px rgba(79,95,230,.12);
 --tx:#1B2559;--mu:#5A668F;--pos:#13845A;--neg:#C42F48;
 --warnbg:rgba(245,158,11,.20);--warntx:#8A5200;--badbg:rgba(239,68,68,.14);--badtx:#B42335;
 --pillbg:rgba(67,97,238,.10);--pilltx:#34419E;--chipb:rgba(67,97,238,.25);--chipoff:rgba(255,255,255,.5);
 --chiponbg:rgba(67,97,238,.16);--chiponb:#4361EE;--chipontx:#243088;--acc1:#4361EE;--acc2:#7A5AF0;--acclink:#3446C9;
 --navbg:rgba(255,255,255,.72);--navb:1px solid rgba(255,255,255,.9);--navtx:#5A668F;--navon:#3446C9;
 --div:rgba(67,97,238,.12);--inputbg:rgba(255,255,255,.7);--inputb:rgba(67,97,238,.22);--track:rgba(67,97,238,.14);
 --w1:#4361EE;--w2:#F59E4B;--w3:#7A5AF0;--fabsh:rgba(67,97,238,.45);--overlay:#EEF1FC;color-scheme:light}
html[data-theme="dark"]{
 --bg:radial-gradient(900px 600px at 100% 0%,rgba(40,90,220,.38),transparent 70%),radial-gradient(800px 600px at 100% 100%,rgba(200,100,40,.24),transparent 70%),#070B14;
 --card:rgba(255,255,255,.06);--cardb:1px solid rgba(255,255,255,.11);--shadow:none;
 --tx:#F2F5FA;--mu:#A9B4C4;--pos:#5FD3A6;--neg:#FF9D94;
 --warnbg:rgba(255,194,102,.16);--warntx:#FFCB80;--badbg:rgba(255,138,128,.16);--badtx:#FF9D94;
 --pillbg:rgba(255,255,255,.09);--pilltx:#C9D3E2;--chipb:rgba(255,255,255,.16);--chipoff:transparent;
 --chiponbg:rgba(90,162,255,.20);--chiponb:#5AA2FF;--chipontx:#FFFFFF;--acc1:#3D7BFF;--acc2:#9B7BFF;--acclink:#7DB4FF;
 --navbg:rgba(14,20,34,.86);--navb:1px solid rgba(255,255,255,.10);--navtx:#9FAABB;--navon:#7DB4FF;
 --div:rgba(255,255,255,.09);--inputbg:rgba(255,255,255,.05);--inputb:rgba(255,255,255,.16);--track:rgba(255,255,255,.10);
 --w1:#3D7BFF;--w2:#FFA45C;--w3:#9B7BFF;--fabsh:rgba(61,123,255,.5);--overlay:#0A0F1C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);background-attachment:fixed;color:var(--tx);font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:15px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.page{max-width:760px;margin:0 auto;padding:calc(12px + var(--sat)) 16px calc(100px + var(--sab));display:flex;flex-direction:column;gap:12px}
.glass{background:var(--card);border:var(--cardb);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap8{gap:8px}.gap12{gap:12px}.wrap{flex-wrap:wrap}
.mu{color:var(--mu)}.small{font-size:13px}.tiny{font-size:12px}.bold{font-weight:600}.b7{font-weight:700}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}.pos{color:var(--pos)}.neg{color:var(--neg)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.iconbtn.glass{border:var(--cardb)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--pillbg);color:var(--pilltx)}
.pill.warn{background:var(--warnbg);color:var(--warntx)}.pill.bad{background:var(--badbg);color:var(--badtx)}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--chipb);background:var(--chipoff);color:var(--tx);font-size:14px;white-space:nowrap}
.chip.on{background:var(--chiponbg);border-color:var(--chiponb);color:var(--chipontx);font-weight:600}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--inputb);background:transparent;color:var(--tx);padding:0 16px;font-size:14px}
.btn.main{border:0;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:600}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.wide{width:100%}
.input{width:100%;height:44px;border-radius:12px;border:1px solid var(--inputb);background:var(--inputbg);padding:0 12px;color:var(--tx);outline:none}
.input:focus{border-color:var(--chiponb)}
.searchbox{position:relative;flex:1}
.searchbox svg{position:absolute;left:12px;top:13px;color:var(--mu)}
.searchbox .input{padding-left:38px}
.track{height:4px;border-radius:2px;background:var(--track);margin-top:6px}.fill{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc1),var(--acc2))}
.banner{padding:8px 12px;border-radius:12px;font-size:13px}.banner.warn{background:var(--warnbg);color:var(--warntx)}.banner.info{background:var(--pillbg);color:var(--pilltx)}
.h2{font-size:18px;font-weight:700;margin:4px 2px 0}
.dayh{font-size:13px;font-weight:600;color:var(--mu);margin:6px 2px 0}
.op{padding:10px 14px;display:flex;gap:12px;cursor:pointer;text-align:left;width:100%}
.op .t{font-size:15px;font-weight:600}.op .s{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.op .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.list{display:flex;flex-direction:column;gap:8px}
.wallet{display:flex;flex-direction:column;gap:3px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;height:calc(68px + var(--sab));padding-bottom:var(--sab);background:var(--navbg);border-top:var(--navb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20}
.nav button{flex:1;border:0;background:transparent;color:var(--navtx);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button.on{color:var(--navon);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--sab));width:56px;height:56px;border-radius:28px;border:0;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px var(--fabsh);z-index:21}
.sheet{position:fixed;inset:0;background:var(--overlay);z-index:50;overflow:auto;padding:calc(8px + var(--sat)) 12px calc(24px + var(--sab))}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;padding:3px;border-radius:14px}.seg button{flex:1;height:36px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-size:14px}
.seg button.on{background:var(--chiponbg);color:var(--chipontx);font-weight:600}
.field{padding:10px 14px;border-bottom:1px solid var(--div);display:flex;flex-direction:column;gap:4px}
.field:last-child{border-bottom:0}.field label{font-size:13px;color:var(--mu)}
.field .input{height:40px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:0}
.field .input:focus{border-bottom-color:var(--chiponb)}
.field .big{font-size:26px;font-weight:700}
.field .input.suggested{color:var(--warntx);background:var(--warnbg);padding:0 8px;border-radius:6px}
.sug{display:none;flex-direction:column;border:1px solid var(--inputb);border-radius:10px;overflow:hidden;background:var(--inputbg)}
.sug.open{display:flex}.sug button{min-height:44px;text-align:left;padding:0 12px;border:0;border-bottom:1px solid var(--div);background:transparent;color:var(--tx);font-size:15px}
.sug button:last-child{border-bottom:0}.sug button.first{background:var(--pillbg)}
.wsel{display:flex;gap:6px;flex-wrap:wrap}
.switch{width:48px;height:28px;border-radius:14px;background:var(--track);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--tx);opacity:.9;transition:left .15s}
.switch.on{background:linear-gradient(135deg,var(--acc1),var(--acc2))}.switch.on::after{left:22px;background:#fff;opacity:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--sab));z-index:60;max-width:520px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--overlay);border:var(--navb);color:var(--tx);display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{border:0;background:transparent;color:var(--acclink);font-weight:600;padding:8px}
.errs{color:var(--neg);font-size:13px;margin:0 2px}
.desk{display:none}
table.tb{width:100%;border-collapse:collapse;font-size:14px}table.tb th{font-size:12px;color:var(--mu);text-align:left;padding:6px 4px;font-weight:500}table.tb td{padding:8px 4px;border-top:1px solid var(--div)}
.dec{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dec .opts{display:flex;gap:8px;flex-wrap:wrap}.dec .opts .btn{flex:1 1 200px}
@media (min-width:900px){
 .page{max-width:1180px;padding:20px 24px 24px 132px}
 .nav{top:0;right:auto;bottom:0;width:100px;height:auto;flex-direction:column;justify-content:flex-start;gap:8px;padding:18px 8px;border-top:0;border-right:var(--navb)}
 .nav button{flex:none;width:100%;height:60px;border-radius:14px;padding:0 4px;white-space:nowrap}
 .nav button.on{background:var(--chiponbg)}
 .fab{right:28px;bottom:28px}
 .desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
 .toast{bottom:24px}
}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--inputb);display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.cb.on{background:linear-gradient(135deg,var(--acc1),var(--acc2));border-color:transparent}
.seg button:disabled{opacity:.45}
.wsel .chip:disabled{opacity:.5}

/* масштаб экрана заблокирован: без двойного касания и без увеличения при вводе */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (pointer:coarse){input,select,textarea{font-size:16px}}

/* список операций одной таблицей, как у Финолога: на телефоне строки в одной карточке, на компьютере столбцы */
.tbl{background:var(--card);border:var(--cardb);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tbl .dayh{margin:0;padding:8px 14px;background:rgba(127,127,127,.08);border-top:var(--cardb)}
.tbl>:first-child{border-top:0}
.row-op{border:0;border-top:var(--cardb);background:transparent;color:inherit;border-radius:0}
.row-op:hover{background:rgba(127,127,127,.07)}
.d-only{display:none}
.tbl .thead{font-size:12px;color:var(--mu)}
@media (min-width:900px){
 .m-only{display:none!important}
 .d-only{display:block}
 .row-op,.tbl .thead{display:grid;grid-template-columns:96px 130px minmax(0,1fr) 260px 170px;gap:14px;align-items:start}
 .tbl .thead{padding:12px 14px}.tbl .thead .r{text-align:right}
 .row-op{padding:10px 14px}
 .row-op .c-amt{text-align:right;white-space:nowrap}
 .row-op .c-cp,.row-op .c-w{font-size:14px;overflow:hidden;text-overflow:ellipsis}
 .row-op .c-main .t{font-weight:500}
 .tbl .dayh{text-align:center}
}

</style>

<body>
<div id="root"></div>
<script src="config.js"></script>
<script>
/* Kubcrafter Деньги: ядро логики (без интерфейса). Работает в браузере и в Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.KC = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- кошельки ---------- */
  // bank: есть выписка банка; ledger: главный учёт наш, выписка только сверяет (Промос)
  var WALLETS = [
    { id: 'alfa', name: 'Альфа-банк', bank: true, ledger: false },
    { id: 'cash', name: 'Наличные', bank: false, ledger: false },
    { id: 'promos', name: 'Промос', bank: true, ledger: true, note: 'по нашему учёту' },
    { id: 'credit', name: 'Кредитный счёт личных средств', bank: false, ledger: false, hidden: true }
  ];
  function wallet(id) { for (var i = 0; i < WALLETS.length; i++) if (WALLETS[i].id === id) return WALLETS[i]; return null; }

  /* ---------- деньги: храним в копейках (целое число) ---------- */
  function parseMoney(v) {
    if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) : NaN;
    if (v == null) return NaN;
    var s = String(v).replace(/[\s\u00A0\u202F]/g, '').replace(/[₽рР]|руб\.?/g, '').replace('\u2212', '-').replace(',', '.');
    if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return NaN;
    return Math.round(parseFloat(s) * 100);
  }
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0'); }
  function formatMoney(k, o) {
    o = o || {};
    var neg = k < 0, abs = Math.abs(k), rub = Math.floor(abs / 100), kop = abs % 100;
    var s = group(rub) + (kop ? ',' + (kop < 10 ? '0' + kop : kop) : '') + '\u00A0₽';
    if (o.sign) return (neg ? '\u2212' : (k > 0 ? '+' : '')) + s;
    return (neg ? '\u2212' : '') + s;
  }

  /* ---------- даты (строки ГГГГ-ММ-ДД) ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return isoDate(new Date()); }
  function parseISO(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
  function addDays(s, n) { var t = new Date(parseISO(s) + n * 86400000); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  var MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  function monthKey(s) { return s.slice(0, 7); }
  function monthLabel(key) { var p = key.split('-'); return MONTHS_NOM[+p[1] - 1] + ' ' + p[0]; }
  function shiftMonth(key, n) { var p = key.split('-'); var m = (+p[0]) * 12 + (+p[1] - 1) + n; return Math.floor(m / 12) + '-' + pad((m % 12) + 1); }
  function dayLabel(s, t) {
    var p = s.split('-'), base = (+p[2]) + ' ' + MONTHS_GEN[+p[1] - 1];
    var d = diffDays(s, t);
    if (d === 0) return 'Сегодня, ' + base;
    if (d === -1) return 'Вчера, ' + base;
    return base + ', ' + WEEKDAYS[new Date(parseISO(s)).getUTCDay()];
  }
  function shortDate(s) { var p = s.split('-'); return (+p[2]) + ' ' + MONTHS_GEN[+p[1] - 1]; }
  function parseDateInput(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return isoDate(v);
    if (typeof v === 'number' && v > 20000 && v < 80000) { // серийный номер Excel
      var t = new Date(Math.round((v - 25569) * 86400000));
      return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
    }
    var s = String(v).trim(), m;
    if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return m[1] + '-' + m[2] + '-' + m[3];
    if ((m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s))) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    return '';
  }
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(parseISO(s)); }

  /* ---------- записи ---------- */
  function uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function nowISO() { return new Date().toISOString(); }
  function isTransfer(r) { return r.kind === 'transfer_out' || r.kind === 'transfer_in'; }
  // вне отчётов и оборота: переводы и корректировки остатка (в остатки кошельков входят)
  var ADJUST_ARTICLE = 'корректировка остатка';
  function isOffReport(r) { return isTransfer(r) || (r.article || '').trim().toLowerCase() === ADJUST_ARTICLE; }
  // перевод, ждущий выписку, всегда в остатке: старое состояние pending у перевода читаем как unconfirmed
  function bankStateOf(r) { return r.bankState === 'pending' && isTransfer(r) ? 'unconfirmed' : r.bankState; }
  function typeOf(r) { return isTransfer(r) ? 'transfer' : (r.amount < 0 ? 'expense' : 'income'); }

  // статус банка: none (наличные), pending (ждёт выписку, в остаток не входит), unconfirmed (Промос, в остатке),
  // confirmed (подтверждено выпиской), absent (в периоде выписки, но в ней нет)
  function defaultBankState(walletId, source) {
    var w = wallet(walletId);
    if (!w || !w.bank) return 'none';
    if (source === 'bank' || source === 'import') return 'confirmed';
    return w.ledger ? 'unconfirmed' : 'pending';
  }
  function newRecord(f) {
    var amt = Math.round(f.amount || 0), now = nowISO();
    return {
      id: f.id || uid(),
      kind: f.kind || (amt < 0 ? 'expense' : 'income'),
      wallet: f.wallet, amount: amt, date: f.date || today(), planned: !!f.planned,
      counterparty: (f.counterparty || '').trim(), article: (f.article || '').trim(), project: (f.project || '').trim(),
      description: (f.description || '').trim(), accrualDate: f.accrualDate || '', docNo: f.docNo || '', order: f.order || '',
      source: f.source || 'phone', bankState: f.bankState || defaultBankState(f.wallet, f.source),
      bankKey: f.bankKey || '', bankDate: f.bankDate || '', bankPurpose: f.bankPurpose || '', pairId: f.pairId || '',
      autofill: f.autofill || '', extId: f.extId || '', note: f.note || '', absentAck: false,
      deleted: false, createdAt: now, updatedAt: now
    };
  }
  function validate(f) {
    var e = [];
    if (!wallet(f.wallet)) e.push('Не выбран кошелёк');
    if (!f.amount || !isFinite(f.amount) || Math.round(f.amount) === 0) e.push('Введите сумму');
    if (!validDate(f.date)) e.push('Неверная дата');
    return e;
  }
  function makeTransfer(f) {
    var abs = Math.abs(Math.round(f.amount)), pairId = uid(), d = f.date || today();
    var common = { date: d, planned: !!f.planned, description: f.description || '', source: f.source || 'phone', pairId: pairId };
    var out = newRecord(Object.assign({ kind: 'transfer_out', wallet: f.from, amount: -abs }, common));
    var inn = newRecord(Object.assign({ kind: 'transfer_in', wallet: f.to, amount: abs }, common));
    [out, inn].forEach(function (r) { var w = wallet(r.wallet); if (w && w.bank && r.source !== 'bank' && r.source !== 'import') r.bankState = 'unconfirmed'; });
    return [out, inn];
  }
  function validateTransfer(f) {
    var e = [];
    if (!wallet(f.from) || !wallet(f.to)) e.push('Выберите оба кошелька');
    else if (f.from === f.to) e.push('Кошельки должны отличаться');
    if (!f.amount || f.amount <= 0) e.push('Введите сумму');
    if (!validDate(f.date)) e.push('Неверная дата');
    return e;
  }
  function missingFields(r) {
    if (r.deleted || isTransfer(r)) return [];

  /* ---------- выписки: загрузка, сверка ---------- */
  function applyStatement(walletId, rows, name) {
    var pendingKeys = S.decisions.filter(function (x) { return !x.resolvedAt && x.row; }).map(function (x) { return x.row.key; });
    var res = KC.reconcile({ records: S.records, wallet: walletId, rows: rows, ignored: S.meta.ignoredKeys, skipKeys: pendingKeys });
    S.decisions = S.decisions.concat(res.decisions);
    var st = res.stats;
    S.meta.statements.push({ wallet: walletId, at: KC.nowISO(), from: res.period ? res.period.from : '', to: res.period ? res.period.to : '', rows: st.rows, name: name || '' });
    ensureCatalogNow(true);
    commit({ patches: res.patches, newRecords: res.newRecords }, 'reconcile', 'Выписка ' + wname(walletId) + ': строк ' + st.rows + ', привязано ' + st.matched + ', добавлено ' + st.added + ', дублей ' + st.duplicates + ', решений ' + st.decisions);
    render();
    var parts = ['строк ' + st.rows, 'привязано ' + st.matched, 'добавлено ' + st.added, 'дублей ' + st.duplicates, 'нужно решение ' + st.decisions];
    if (st.absent) parts.push('нет в выписке ' + st.absent);
    toast('Выписка ' + wname(walletId) + ': ' + parts.join(', '));
  }
  function readTable(file, cb) {
    if (!window.XLSX) { toast('Библиотека xlsx не загрузилась (нет связи). Повторите позже.'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      try { var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true }); var ws = wb.Sheets[wb.SheetNames[0]]; cb(ws, wb); }
      catch (e) { toast('Не удалось прочитать файл: ' + (e && e.message ? e.message : '')); }
    };
    fr.readAsArrayBuffer(file);
  }
  var FIELD_LABELS = { date: 'Дата', amount: 'Сумма (со знаком)', debit: 'Списание (дебет)', credit: 'Поступление (кредит)', counterparty: 'Контрагент', purpose: 'Назначение платежа', docNo: 'Номер документа' };

  function resolveDec(id, c) {
    var d = S.decisions.filter(function (x) { return x.id === id && !x.resolvedAt; })[0]; if (!d) return;

  /* ---------- копии, импорт ---------- */
  // одно нажатие = один файл (iPhone Safari отбрасывает второе скачивание из одного нажатия)
  function backupBase() { return 'kubcrafter-dengi-' + S.mode + '-' + KC.today(); }
  function markBackup() { S.meta.lastBackupAt = KC.nowISO(); addLog('backup', 'Сделана копия (' + S.records.length + ' записей)'); persist(); render(); }
  function doBackupJson() {
    var obj = KC.backupObject({ records: S.records, log: S.log, decisions: S.decisions, meta: { ignoredKeys: S.meta.ignoredKeys, statements: S.meta.statements, projects: S.meta.projects, articles: S.meta.articles }, namespace: S.mode });
    var name = backupBase() + '.json', text = JSON.stringify(obj);
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    // iPhone: системное меню «Поделиться» → «Сохранить в Файлы»; если недоступно или отменено, обычное скачивание
    if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: name }).then(markBackup, function (e) {
        if (e && e.name === 'AbortError') return;
        return download(name, new Blob([text], { type: 'application/octet-stream' })).then(markBackup);
      });
    }
    return download(name, new Blob([text], { type: 'application/octet-stream' })).then(markBackup);
  }
  function doBackupXlsx() {
    if (!window.XLSX) { toast('Библиотека xlsx не загрузилась (нет связи). Для восстановления используйте JSON.'); return Promise.resolve(); }
    var ws = XLSX.utils.aoa_to_sheet(KC.recordsToTable(S.records)), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Операции');
    var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return download(backupBase() + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }
  function doRestore(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var o = jparse(fr.result, null), err = KC.validateBackup(o);
      if (err) return toast(err);
      if (!confirm('Заменить текущие данные (' + S.records.length + ' записей) данными из копии (' + o.records.length + ' записей)?')) return;
      S.records = o.records; S.log = o.log || []; S.decisions = o.decisions || [];
      S.meta.ignoredKeys = (o.meta && o.meta.ignoredKeys) || []; S.meta.statements = (o.meta && o.meta.statements) || []; S.meta.projects = (o.meta && o.meta.projects) || {}; S.meta.articles = (o.meta && o.meta.articles) || []; ensureCatalogNow(true);
      S.records.forEach(function (r) { S.meta.dirty[r.id] = 1; });
      addLog('restore', 'Восстановлено из копии от ' + ruDate(o.createdAt) + ' (' + o.records.length + ' записей)'); persist(); render(); toast('Данные восстановлены');
    };
    fr.readAsText(file);
  }
  function doImportSummary(file) {
    var lim = parseInt(($('#importlimit') || {}).value, 10);
    readTable(file, function (ws) {
      var objs = XLSX.utils.sheet_to_json(ws, { raw: true, defval: '', cellDates: true });
      if (lim > 0) objs = objs.slice(0, lim);
      var res = KC.importSummary(objs, S.records);
      if (!res.records.length) return toast('Нечего загружать: пропущено ' + res.skipped + ', дублей ' + res.duplicates);
      if (!confirm('Будет добавлено записей: ' + res.records.length + ', пропущено: ' + res.skipped + ', уже есть: ' + res.duplicates + '. Продолжить?')) return;

      var newArts = ensureCatalogNow(); if (newArts) addLog('catalog', 'Из таблицы добавлено статей в справочник: ' + newArts + ' (вид деятельности не определён)'); persist();
      render(); toast('Импортировано записей: ' + res.records.length + (newArts ? '. Новых статей: ' + newArts + ', укажите им вид деятельности в Настройках' : ''));

    document.documentElement.setAttribute('data-theme', S.theme);
    var body = S.view === 'projects' ? viewProjects() : S.view === 'statements' ? viewStatements() : S.view === 'settings' ? viewSettings() : viewOps();
    var nav = '<nav class="nav" aria-label="Разделы">' + NAV.map(function (n) { return '<button type="button" class="' + (S.view === n[0] ? 'on' : '') + '" data-act="nav" data-v="' + n[0] + '">' + svg(n[2], 22) + n[1] + '</button>'; }).join('') + '</nav>';
    var fab = S.view === 'ops' ? '<button type="button" class="fab" data-act="newrec" aria-label="Новая операция">' + svg('plus', 26) + '</button>' : '';
    $('#root').innerHTML = '<div class="app"><main class="page" id="main">' + body + '</main>' + nav + fab + '</div>';
    if (S.view === 'ops' && S.sync.text) { var sp = $('#syncpill'); if (sp) sp.textContent = S.sync.text; }
    if (S.pcard) renderPCard();
  }
  function refreshOpsParts() {
    var l = $('#list'); if (l) l.innerHTML = listHtml();
    var u = $('#unfilledchip'); if (u) u.textContent = 'Не заполнено: ' + KC.unfilledCount(S.records);
  }
  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'pick') { e.preventDefault(); var id = t.getAttribute('data-f'); setField(id, t.getAttribute('data-v')); hideSug(id); nextFocus(id); return; }
    if (a === 'confirmart') { e.preventDefault(); S.form.artSuggested = false; refreshArt(); return; }
    if (a.indexOf('pc-') === 0) { e.preventDefault(); return pcAction(a, t); }
    if (a.indexOf('art-') === 0) { e.preventDefault(); if (a === 'art-open') return openArtSheet(t.getAttribute('data-id')); return artAction(a, t); }
    if (a === 'closeform') return closeForm();
    if (a === 'saveform') return saveForm();
    if (a === 'ftype') { var f = S.form; f.type = t.getAttribute('data-v'); f.errors = []; var cur = f.article ? KC.findArticle(S.meta.articles, f.article) : null; if (f.type === 'transfer' || f.artSuggested || (cur && (cur.kind === 'expense') !== (f.type === 'expense'))) { f.article = ''; f.artSuggested = false; } renderForm(); return; }
    if (a === 'wallet') { var k = t.getAttribute('data-k'); S.form[k] = t.getAttribute('data-v'); renderForm(); return; }
    if (a === 'planned') { S.form.planned = !S.form.planned; renderForm(); return; }
    if (a === 'deleterec') return deleteRec(S.form.editId);
    if (a === 'closemodal') { S.modal = null; return renderModal(); }
    if (a === 'runstm') { var m = S.modal, rows = KC.rowsFromTable(m.table, m.header, m.map).rows; S.modal = null; renderModal(); return applyStatement(m.wallet, rows, m.name); }
    e.preventDefault && t.tagName === 'A' && e.preventDefault();
    if (a === 'nav') { S.view = t.getAttribute('data-v'); return render(); }
    if (a === 'gocopies') { S.view = 'settings'; S.settingsTab = 'data'; return render(); }
    if (a === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; lsSet('kc.theme', S.theme); return render(); }
    if (a === 'month') { S.month = KC.shiftMonth(S.month, +t.getAttribute('data-n')); return render(); }
    if (a === 'type') { S.type = t.getAttribute('data-v'); return render(); }
    if (a === 'unfilled') { S.unfilled = !S.unfilled; return render(); }
    if (a === 'walletstoggle') { S.walletsOpen = !S.walletsOpen; return render(); }
    if (a === 'newrec') return openForm(null);
    if (a === 'edit') { var rec = byId(t.getAttribute('data-id')); if (rec) openForm(rec); return; }
    if (a === 'openproject') return openProjectCard(t.getAttribute('data-p'));
    if (a === 'clearproject') { S.project = ''; return render(); }
    if (a === 'stab') { S.settingsTab = t.getAttribute('data-v'); return render(); }
    if (a === 'seedcat') { var have = {}; S.meta.articles.forEach(function (x) { have[x.name.toLowerCase()] = 1; }); var sc = KC.sampleCatalog().filter(function (x) { return !have[x.name.toLowerCase()]; }); S.meta.articles = S.meta.articles.concat(sc); addLog('catalog', 'Добавлен тестовый список статей (' + sc.length + ')'); persist(); render(); return toast('Добавлен тестовый список статей'); }
    if (a === 'seed') { var hv = {}; S.meta.articles.forEach(function (x) { hv[x.name.toLowerCase()] = 1; }); S.meta.articles = S.meta.articles.concat(KC.sampleCatalog().filter(function (x) { return !hv[x.name.toLowerCase()]; })); var smp = KC.sampleRecords(); commit({ newRecords: smp }, 'import', 'Добавлены тестовые данные (' + smp.length + ' записей)'); render(); return toast('Добавлены выдуманные тестовые данные'); }
    if (a === 'resetTest') return resetTest();
    if (a === 'backup') return doBackupJson();
    if (a === 'backupxlsx') return doBackupXlsx();
    if (a === 'teststm') return applyStatement(t.getAttribute('data-w'), KC.sampleStatement(t.getAttribute('data-w')), 'тестовая выписка');
    if (a === 'resolve') return resolveDec(t.getAttribute('data-id'), t.getAttribute('data-c'));
    if (a === 'signin') return remoteSignIn();
    if (a === 'switchmode') {
      var to = S.mode === 'test' ? 'prod' : 'test';
      if (to === 'prod' && !confirm('Перейти на РАБОЧУЮ базу? Все записи будут настоящими.')) return;
      lsSet('kc.mode', to); load(); render(); remoteInit(); return;
    }
    if (a === 'theme' ) return;
  }
  function onInput(e) {
    var id = e.target.id;
    if (id === 'a-name' && S.artSheet) { S.artSheet.name = e.target.value; return; }
    if (id === 'q') { S.query = e.target.value; return refreshOpsParts(); }
    if (id === 'pq') { S.projQuery = e.target.value; var l = $('#projlist'); if (l) { var keep = S.projQuery; render(); var el = $('#pq'); if (el) { el.focus(); el.setSelectionRange(keep.length, keep.length); } } return; }
    if (S.form) onFormInput(e);
  }
  function onChange(e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-stm')) { var f = t.files[0]; t.value = ''; if (f) openStatementFile(t.getAttribute('data-stm'), f); return; }
    if (t.id === 'restorefile') { var f2 = t.files[0]; t.value = ''; if (f2) doRestore(f2); return; }
    if (t.id === 'summaryfile') { var f3 = t.files[0]; t.value = ''; if (f3) doImportSummary(f3); return; }
    if (t.getAttribute && t.getAttribute('data-map') && S.modal) { var v = t.value; S.modal.map[t.getAttribute('data-map')] = v === '' ? undefined : +v; renderModal(); return; }
    if (t.id === 'hdr' && S.modal) { var n = parseInt(t.value, 10); if (n > 0 && n <= S.modal.table.length) { S.modal.header = n - 1; S.modal.map = KC.detectColumns(S.modal.table[n - 1] || []); renderModal(); } return; }
    if (t.id === 'f-cp' && S.form) { S.form.counterparty = t.value; autoArticle(); }
    if (t.id === 'pc-from' && S.pcard) S.pcard.from = t.value;
    if (t.id === 'pc-to' && S.pcard) S.pcard.to = t.value;
  }
  function onFocusOut(e) { var id = e.target && e.target.id; if (id && (id === 'f-cp' || id === 'f-art' || id === 'f-proj')) setTimeout(function () { hideSug(id); if (id === 'f-art' && S.form) { var el = $('#f-art'); if (el && document.activeElement !== el) el.value = S.form.article; } }, 150); }
  function onFocusIn(e) { var id = e.target && e.target.id; if (id && (id === 'f-cp' || id === 'f-art' || id === 'f-proj')) showSug(id); }

  function init() {
    load();
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onFormKey);
    document.addEventListener('focusin', onFocusIn);
    document.addEventListener('focusout', onFocusOut);
    document.addEventListener('pointerdown', function (e) { if (e.target.closest && e.target.closest('.sug')) e.preventDefault(); });
    // iOS Safari игнорирует user-scalable=no, поэтому щипок и двойное касание гасим отдельно
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
    document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    window.addEventListener('online', function () { S.online = true; render(); scheduleSync(); });
    window.addEventListener('offline', function () { S.online = false; render(); });
    if (CFG.firebase) { setSync('connecting', 'Облако: подключение…'); remoteInit(); } else setSync('local', '');
    if (CFG.sw && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
    render();
    window.KCApp = { S: S, commit: commit, render: render };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
